name: Continuous Deployment (CD)

on:
  push:
    branches:
      - main

jobs:
  deploy_production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Notify Deployment Start
        run: echo "Notificando inicio de despliegue a los administradores..."

      - name: Run Backup Script
        run: |
          chmod +x scripts/backup.sh
          ./scripts/backup.sh

      - name: Deploy to Hostinger (Simulated via FTP/SSH)
        run: |
          echo "Conectando a Hostinger..."
          echo "Subiendo archivos..."
          echo "Despliegue simulado exitoso."

      - name: Verify Health
        run: echo "Verificando estado de la aplicacion en produccion... OK"
